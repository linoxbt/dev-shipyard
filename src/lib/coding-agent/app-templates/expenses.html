<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spendwise · Expense tracker</title>
<style>
  :root { --bg:#fbfaf7; --card:#fff; --line:#e7e3da; --text:#1c1f24; --muted:#6b7280; --accent:#0f766e; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:880px; margin:0 auto; padding:22px 16px 40px; display:grid; gap:16px; grid-template-columns:1fr 1fr; }
  header { grid-column:1/-1; display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:10px; }
  h1 { font-size:22px; letter-spacing:-.02em; } h1 span { color:var(--accent); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px; }
  .total { font-size:34px; font-weight:800; letter-spacing:-.03em; margin-top:4px; } .muted { color:var(--muted); font-size:13px; }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 5px; }
  input, select { width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:14px; background:#fff; color:var(--text); }
  input:focus, select:focus { outline:2px solid var(--accent); border-color:transparent; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .btn { margin-top:14px; width:100%; background:var(--accent); color:#fff; border:0; border-radius:12px; padding:12px; font-weight:600; font-size:14px; cursor:pointer; }
  .err { color:#b91c1c; font-size:12px; min-height:16px; margin-top:6px; }
  .bars { display:grid; gap:10px; margin-top:12px; }
  .bar { display:grid; grid-template-columns:90px 1fr 70px; gap:8px; align-items:center; font-size:13px; }
  .track { height:10px; border-radius:999px; background:#f0ede6; overflow:hidden; } .fill { height:100%; border-radius:999px; transition:width .4s; }
  .list { grid-column:1/-1; } .item { display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--line); }
  .item:first-of-type { border-top:0; } .dot { width:10px; height:10px; border-radius:50%; flex:none; }
  .item div { flex:1; min-width:0; } .item strong { display:block; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item button { border:0; background:none; color:var(--muted); cursor:pointer; font-size:14px; } .item button:hover { color:#b91c1c; }
  .empty { color:var(--muted); text-align:center; padding:20px; font-size:14px; }
  @media (max-width:720px) { main { grid-template-columns:1fr; } }
</style>
</head>
<body>
<main>
  <header>
    <div><h1>Spend<span>wise</span></h1><p class="muted">Where your money went this month</p></div>
    <select id="month" aria-label="Month" style="width:auto"></select>
  </header>
  <section class="card">
    <p class="muted">Spent in <span id="monthName"></span></p>
    <p class="total" id="total">$0.00</p>
    <p class="muted" id="count"></p>
    <div class="bars" id="bars" aria-label="Spending by category"></div>
  </section>
  <section class="card">
    <h2 style="font-size:15px">Add an expense</h2>
    <form id="form" novalidate>
      <label for="what">What for</label>
      <input id="what" maxlength="60" placeholder="Groceries, taxi…" />
      <div class="row">
        <div><label for="amount">Amount</label><input id="amount" inputmode="decimal" placeholder="0.00" /></div>
        <div><label for="date">Date</label><input id="date" type="date" /></div>
      </div>
      <label for="cat">Category</label>
      <select id="cat"></select>
      <p class="err" id="err" role="alert"></p>
      <button class="btn">Add expense</button>
    </form>
  </section>
  <section class="card list"><h2 style="font-size:15px;margin-bottom:6px">Expenses</h2><div id="items"></div></section>
</main>
<script>
  const store = (() => { try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); return localStorage; }
    catch { const m = {}; return { getItem: (k) => m[k] ?? null, setItem: (k, v) => { m[k] = String(v); } }; } })();
  const CATS = { Food: "#f59e0b", Transport: "#3b82f6", Home: "#0f766e", Fun: "#a855f7", Health: "#ef4444", Other: "#6b7280" };
  const $ = (id) => document.getElementById(id);
  const money = (n) => n.toLocaleString("en-US", { style: "currency", currency: "USD" });
  const today = new Date().toISOString().slice(0, 10);
  const month = (d) => d.slice(0, 7);
  let items = JSON.parse(store.getItem("spend") || "null") || [
    { id: 1, what: "Weekly groceries", amount: 86.4, cat: "Food", date: today },
    { id: 2, what: "Train pass", amount: 45, cat: "Transport", date: today },
    { id: 3, what: "Cinema", amount: 24, cat: "Fun", date: today },
    { id: 4, what: "Electricity bill", amount: 61.2, cat: "Home", date: today },
  ];
  const save = () => store.setItem("spend", JSON.stringify(items));
  for (const c of Object.keys(CATS)) $("cat").insertAdjacentHTML("beforeend", `<option>${c}</option>`);
  $("date").value = today;

  function months() {
    const set = new Set([month(today), ...items.map((i) => month(i.date))]);
    const sel = $("month"), current = sel.value || month(today);
    sel.innerHTML = [...set].sort().reverse().map((m) => `<option value="${m}">${new Date(m + "-01T00:00").toLocaleDateString("en-US", { month: "long", year: "numeric" })}</option>`).join("");
    sel.value = set.has(current) ? current : month(today);
  }

  function render() {
    months();
    const m = $("month").value, shown = items.filter((i) => month(i.date) === m).sort((a, b) => b.date.localeCompare(a.date));
    const total = shown.reduce((s, i) => s + i.amount, 0);
    $("monthName").textContent = $("month").selectedOptions[0]?.textContent ?? "";
    $("total").textContent = money(total);
    $("count").textContent = shown.length ? `${shown.length} expense${shown.length === 1 ? "" : "s"}` : "Nothing spent yet";
    const byCat = Object.keys(CATS).map((c) => [c, shown.filter((i) => i.cat === c).reduce((s, i) => s + i.amount, 0)]).filter(([, v]) => v > 0);
    const max = Math.max(1, ...byCat.map(([, v]) => v));
    $("bars").innerHTML = byCat.map(([c, v]) => `<div class="bar"><span>${c}</span><div class="track"><div class="fill" style="width:${(v / max) * 100}%;background:${CATS[c]}"></div></div><span style="text-align:right">${money(v)}</span></div>`).join("");
    const list = $("items");
    list.innerHTML = shown.length ? "" : '<p class="empty">No expenses this month. Add one to see the breakdown.</p>';
    for (const i of shown) {
      const row = document.createElement("div");
      row.className = "item";
      row.innerHTML = `<span class="dot" style="background:${CATS[i.cat]}"></span><div><strong></strong><span class="muted">${i.cat} · ${new Date(i.date + "T00:00").toLocaleDateString()}</span></div><b>${money(i.amount)}</b><button aria-label="Delete">✕</button>`;
      row.querySelector("strong").textContent = i.what;
      row.querySelector("button").onclick = () => { items = items.filter((x) => x !== i); save(); render(); };
      list.appendChild(row);
    }
  }

  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const what = $("what").value.trim(), amount = Math.round(Number($("amount").value.replace(/[$,]/g, "")) * 100) / 100, date = $("date").value;
    const err = !what ? "Say what the expense was for." : !(amount > 0) ? "Enter an amount above zero." : !date ? "Pick a date." : "";
    $("err").textContent = err;
    if (err) return;
    items.push({ id: Date.now(), what, amount, cat: $("cat").value, date });
    save(); $("month").value = month(date); render();
    $("what").value = ""; $("amount").value = ""; $("what").focus();
  });
  $("month").addEventListener("change", render);
  render();
</script>
</body>
</html>
