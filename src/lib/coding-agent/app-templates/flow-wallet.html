<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flow · Stablecoin payments</title>
<style>
  :root { --bg:#0b0f14; --card:#121821; --line:#1f2733; --text:#e8edf3; --muted:#8a96a6; --accent:#3b82f6; --good:#22c55e; --bad:#ef4444; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  main { max-width:440px; margin:0 auto; padding:20px 16px 40px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .brand { font-weight:800; font-size:20px; letter-spacing:-.02em; } .brand span { color:var(--accent); }
  .avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#3b82f6,#a855f7); display:grid; place-items:center; font-weight:700; font-size:13px; }
  .balance { background:linear-gradient(145deg,#1d4ed8,#7c3aed); border-radius:24px; padding:22px; box-shadow:0 20px 40px -20px #3b82f680; }
  .balance small { opacity:.8; font-size:13px; } .balance h1 { font-size:40px; letter-spacing:-.03em; margin:6px 0 2px; } .balance p { opacity:.85; font-size:13px; }
  .actions { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:16px 0 24px; }
  .actions button { background:var(--card); border:1px solid var(--line); color:var(--text); border-radius:16px; padding:14px 6px; font-size:13px; cursor:pointer; }
  .actions button:hover { border-color:var(--accent); } .actions b { display:block; font-size:20px; margin-bottom:4px; }
  h2 { font-size:15px; margin-bottom:10px; display:flex; justify-content:space-between; } h2 button { background:none; border:0; color:var(--accent); cursor:pointer; font-size:13px; }
  .list { background:var(--card); border:1px solid var(--line); border-radius:18px; overflow:hidden; }
  .tx { display:flex; align-items:center; gap:12px; padding:13px 14px; border-top:1px solid var(--line); } .tx:first-child { border-top:0; }
  .tx .ic { width:36px; height:36px; border-radius:12px; display:grid; place-items:center; font-size:16px; background:#1b2330; }
  .tx div { flex:1; min-width:0; } .tx strong { font-size:14px; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .tx small { color:var(--muted); font-size:12px; }
  .amt { font-weight:700; font-size:14px; } .in { color:var(--good); }
  .empty { padding:28px; text-align:center; color:var(--muted); font-size:14px; }
  dialog { border:0; border-radius:22px 22px 0 0; background:var(--card); color:var(--text); width:100%; max-width:440px; margin:auto auto 0; padding:22px 18px 28px; }
  dialog::backdrop { background:#000a; }
  label { display:block; font-size:12px; color:var(--muted); margin:12px 0 6px; }
  input, select { width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:12px; padding:12px; font-size:15px; }
  input:focus, select:focus { outline:2px solid var(--accent); border-color:transparent; }
  .err { color:var(--bad); font-size:12px; min-height:16px; margin-top:6px; }
  .primary { width:100%; margin-top:16px; background:var(--accent); color:#fff; border:0; border-radius:14px; padding:14px; font-size:15px; font-weight:600; cursor:pointer; }
  .primary:disabled { opacity:.5; cursor:not-allowed; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#1e293b; padding:12px 18px; border-radius:999px; font-size:14px; opacity:0; transition:.25s; pointer-events:none; }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<main>
  <header><div class="brand">Fl<span>o</span>w</div><div class="avatar" aria-label="Your account">AL</div></header>
  <section class="balance" aria-live="polite">
    <small>Total balance · USDC</small>
    <h1 id="balance">$0.00</h1>
    <p id="change">Ready to send</p>
  </section>
  <div class="actions">
    <button data-open="send"><b>↗</b>Send</button>
    <button data-open="request"><b>↙</b>Request</button>
    <button id="topup"><b>＋</b>Add funds</button>
  </div>
  <h2>Activity <button id="clear">Clear</button></h2>
  <div class="list" id="list"></div>
</main>

<dialog id="send">
  <form method="dialog" id="sendForm" novalidate>
    <h2>Send USDC</h2>
    <label for="to">To (name or 0x address)</label>
    <input id="to" autocomplete="off" placeholder="ada.eth or 0x…" />
    <label for="amount">Amount</label>
    <input id="amount" inputmode="decimal" placeholder="0.00" />
    <label for="note">Note (optional)</label>
    <input id="note" maxlength="60" placeholder="Dinner, rent…" />
    <div class="err" id="sendErr" role="alert"></div>
    <button class="primary" id="sendBtn" value="ok">Send</button>
  </form>
</dialog>

<dialog id="request">
  <form method="dialog" id="reqForm" novalidate>
    <h2>Request USDC</h2>
    <label for="from">From</label>
    <input id="from" autocomplete="off" placeholder="Name or address" />
    <label for="reqAmount">Amount</label>
    <input id="reqAmount" inputmode="decimal" placeholder="0.00" />
    <div class="err" id="reqErr" role="alert"></div>
    <button class="primary" value="ok">Create request</button>
  </form>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
  // Storage that still works inside a sandboxed preview.
  const store = (() => { try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); return localStorage; }
    catch { const m = {}; return { getItem: (k) => m[k] ?? null, setItem: (k, v) => { m[k] = String(v); } }; } })();
  const $ = (id) => document.getElementById(id);
  const money = (n) => n.toLocaleString("en-US", { style: "currency", currency: "USD" });
  let state = JSON.parse(store.getItem("flow") || "null") || {
    balance: 1284.5,
    txs: [
      { kind: "in", who: "Salary · Acme Inc", amount: 2400, at: Date.now() - 864e5 * 2 },
      { kind: "out", who: "Ada Lovelace", note: "Dinner", amount: 42.5, at: Date.now() - 864e5 },
      { kind: "out", who: "0x8ba1…BA72", note: "Rent share", amount: 1073, at: Date.now() - 36e5 * 5 },
    ],
  };
  const save = () => store.setItem("flow", JSON.stringify(state));
  const toast = (t) => { $("toast").textContent = t; $("toast").classList.add("show"); setTimeout(() => $("toast").classList.remove("show"), 2200); };
  const ago = (t) => { const m = Math.round((Date.now() - t) / 6e4); return m < 60 ? `${Math.max(1, m)}m ago` : m < 1440 ? `${Math.round(m / 60)}h ago` : `${Math.round(m / 1440)}d ago`; };

  function render() {
    $("balance").textContent = money(state.balance);
    const list = $("list");
    list.innerHTML = "";
    if (!state.txs.length) { list.innerHTML = '<p class="empty">No activity yet. Send or request USDC to get started.</p>'; return; }
    for (const tx of [...state.txs].sort((a, b) => b.at - a.at)) {
      const row = document.createElement("div");
      row.className = "tx";
      const label = tx.kind === "in" ? "Received" : tx.kind === "req" ? "Requested" : "Sent";
      row.innerHTML = `<span class="ic">${tx.kind === "in" ? "↙" : tx.kind === "req" ? "⏳" : "↗"}</span>
        <div><strong></strong><small>${label} · ${ago(tx.at)}</small></div>
        <span class="amt ${tx.kind === "in" ? "in" : ""}">${tx.kind === "in" ? "+" : tx.kind === "req" ? "" : "−"}${money(tx.amount)}</span>`;
      row.querySelector("strong").textContent = tx.note ? `${tx.who} · ${tx.note}` : tx.who;
      list.appendChild(row);
    }
  }

  const parseAmount = (v) => { const n = Number(String(v).replace(/[$,\s]/g, "")); return Number.isFinite(n) ? Math.round(n * 100) / 100 : NaN; };
  const validRecipient = (v) => /^0x[0-9a-fA-F]{40}$/.test(v) || /^[\w .-]{2,40}$/.test(v);

  document.querySelectorAll("[data-open]").forEach((b) => b.addEventListener("click", () => $(b.dataset.open).showModal()));
  $("sendForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const to = $("to").value.trim(), amount = parseAmount($("amount").value);
    const err = !validRecipient(to) ? "Enter a name or a full 0x address." : !(amount > 0) ? "Enter an amount above zero." : amount > state.balance ? `You have ${money(state.balance)} available.` : "";
    $("sendErr").textContent = err;
    if (err) return;
    $("sendBtn").disabled = true; $("sendBtn").textContent = "Sending…";
    setTimeout(() => {
      state.balance = Math.round((state.balance - amount) * 100) / 100;
      state.txs.push({ kind: "out", who: to.startsWith("0x") ? `${to.slice(0, 6)}…${to.slice(-4)}` : to, note: $("note").value.trim(), amount, at: Date.now() });
      save(); render(); $("send").close(); e.target.reset();
      $("sendBtn").disabled = false; $("sendBtn").textContent = "Send";
      toast(`Sent ${money(amount)} to ${to}`);
    }, 700);
  });
  $("reqForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const from = $("from").value.trim(), amount = parseAmount($("reqAmount").value);
    const err = !validRecipient(from) ? "Enter who should pay." : !(amount > 0) ? "Enter an amount above zero." : "";
    $("reqErr").textContent = err;
    if (err) return;
    state.txs.push({ kind: "req", who: from, amount, at: Date.now() });
    save(); render(); $("request").close(); e.target.reset();
    toast(`Request for ${money(amount)} created`);
  });
  $("topup").addEventListener("click", () => { state.balance += 100; state.txs.push({ kind: "in", who: "Top up · Card", amount: 100, at: Date.now() }); save(); render(); toast("Added $100.00"); });
  $("clear").addEventListener("click", () => { state.txs = []; save(); render(); });
  render();
</script>
</body>
</html>
