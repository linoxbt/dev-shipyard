# Foundry settings for QIE. Merge into your project's foundry.toml.

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
# QIE's EVM has no MCOPY, so compile for Shanghai rather than Cancun.
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
qie = "https://rpc1mainnet.qie.digital"
qie_testnet = "https://rpc1testnet.qie.digital"
