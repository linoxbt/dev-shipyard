name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun test

      - name: Build
        run: bun run build
        env:
          # Nitro's final bundling step exceeds Node's default ~2GB old-space
          # heap for this app's dependency graph (wagmi, WalletConnect,
          # Coinbase/MetaMask SDKs, Monaco) — see DEPLOYMENT.md.
          NODE_OPTIONS: --max-old-space-size=4096
