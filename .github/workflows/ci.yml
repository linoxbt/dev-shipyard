name: CI

on:
  push:
    # app-builder is where the work happens; main is what deploys. Only main
    # was listed, so twenty-one commits of agent work -- the sandbox, the
    # benchmark, the repo flow -- were written, merged and never once run
    # through this file.
    branches: [main, app-builder]
  pull_request:

# Read-only by default. No job here pushes, comments or publishes.
permissions:
  contents: read

# A newer push to the same branch makes the older run's result irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned: `latest` made CI resolve a different Bun (and lockfile format) from
  # the one the repo was developed and locked with. Bump deliberately.
  BUN_VERSION: 1.4.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by major tag and kept current by Dependabot
      # (.github/dependabot.yml).
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Typecheck the CLI package's JavaScript
        run: bunx tsc -p tsconfig.cli.json

      - name: Lint
        run: bun run lint

      # Named directories rather than a bare `bun test`, which also picked up
      # the runner's Docker suite (services/runner/README.md keeps it out of
      # the fast run; the sandbox job below runs it with an image present).
      - name: Unit tests
        run: bun test ./src ./bench ./scripts

      - name: Contract artifacts match the source
        run: bun run scripts/check-contracts.ts

      - name: Contract behaviour tests
        run: bun test ./contracts/test

      - name: Dependency audit
        # High and critical only: the lower tiers are dominated by advisories
        # in dev-only transitive packages with no exploitable path here.
        run: bun audit --audit-level=high

      - name: CLI bundle smoke test
        run: |
          bun run scripts/build-cli.ts --bundle
          bun packages/cli/devstation.js --version

      - name: Build
        run: bun run build
        env:
          # Nitro's final bundling step exceeds Node's default ~2GB old-space
          # heap for this app's dependency graph (wagmi, WalletConnect,
          # Coinbase/MetaMask SDKs, Monaco): see DEPLOYMENT.md. The Netlify
          # preset (now the default, and what production builds) aborted at
          # 4096 and completes at 6144; a GitHub runner has the memory.
          NODE_OPTIONS: --max-old-space-size=6144

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so a key that was committed and later deleted is
          # still found.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Everything that needs a container.
  #
  # Split out because it is slower, and separate because of how it used to
  # fail: the sandbox tests skip themselves when the image is missing, so the
  # fast job above went green while Phase G's central guarantee -- that the
  # agent's commands run inside a container -- was never executed at all. A
  # skip that reads as a pass is worse than a missing test.
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the sandbox image
        # docker/ as the context, matching `bun run sandbox:image`: the
        # Dockerfile copies nothing in, and `.` shipped the whole repo
        # (node_modules included) to the daemon for every build.
        run: docker build -f docker/sandbox.Dockerfile -t devstation-sandbox:1 docker

      - name: Prove the image is there
        # The tests skip silently without it, so the skip is made loud here
        # rather than discovered months later.
        run: docker image inspect devstation-sandbox:1 >/dev/null

      - name: Sandbox and runner tests
        # gVisor is not installed on a GitHub runner, so these run under runc.
        # That exercises the mount namespace, the uid mapping, the in-container
        # timeout and the sealed network -- everything except the gVisor kernel
        # itself, which is the part this cannot check here and which the
        # production runner's /health reports instead.
        env:
          DEVSTATION_SANDBOX_RUNTIME: runc
        run: |
          bun test ./src/lib/agent/sandbox-exec.test.ts
          bun test ./services/runner/src
