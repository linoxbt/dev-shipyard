name: Release CLI

# Builds and publishes the CLI from CI instead of a laptop, and signs it.
#
# Push a tag named v<version> (matching src/lib/agent/cli/args.ts) to run it:
# `devstation upgrade` and install.sh download from v<version> releases. The release carries the five binaries, SHA256SUMS, a Sigstore bundle for
# SHA256SUMS (keyless: signed with this workflow's GitHub OIDC identity, so
# there is no signing key to leak), and build-provenance attestations for
# every binary. public/install.sh verifies the Sigstore bundle with cosign.

on:
  push:
    tags: ["v*"]

# Nothing by default; each job asks for exactly what it needs. The build job,
# which runs this repo's code and its dependencies' install scripts, never
# holds the signing identity or write access. Only the small publish job does,
# and it runs no code from the repo.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.2"

# Actions are pinned by commit SHA here (the tag they were taken from is in
# the comment): this workflow holds the release signing identity, so a moved
# tag upstream must not change what runs in it. Dependabot updates the SHAs.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: The tag matches the CLI's version
        run: |
          version=$(bun -e 'import { VERSION } from "./src/lib/agent/cli/args"; console.log(VERSION)')
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the CLI version $version"
            exit 1
          fi

      - name: Typecheck and test the CLI
        run: |
          bunx tsc --noEmit
          bunx tsc -p tsconfig.cli.json
          bun test ./src/lib/agent

      - name: Build every target
        run: bun run cli:build

      - name: Every target built
        # build-cli skips a platform that fails, which is right on a laptop
        # and wrong for a release.
        run: test "$(ls dist-cli/bin | wc -l)" -eq 5

      - name: Check the binaries against their checksums
        working-directory: dist-cli/bin
        run: sha256sum -c ../SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli
          path: |
            dist-cli/bin/
            dist-cli/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A GitHub environment, so the repository can require a reviewer before
    # anything is signed (Settings -> Environments -> release).
    environment: release
    permissions:
      contents: write # create the release
      id-token: write # Sigstore keyless signing and attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cli
          path: dist-cli

      - name: Check the binaries against their checksums
        working-directory: dist-cli/bin
        run: sha256sum -c ../SHA256SUMS

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign SHA256SUMS
        run: cosign sign-blob --yes --bundle dist-cli/SHA256SUMS.sigstore.json dist-cli/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist-cli/bin/*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist-cli/bin/* dist-cli/SHA256SUMS dist-cli/SHA256SUMS.sigstore.json \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "DevStation CLI ${GITHUB_REF_NAME#v}" \
            --notes "Binaries are built by this workflow. SHA256SUMS is signed with Sigstore (SHA256SUMS.sigstore.json) by this tag's run of release.yml; install.sh and \`devstation upgrade\` verify it when cosign is installed. Each binary also has a build-provenance attestation: gh attestation verify <file> --repo ${GITHUB_REPOSITORY}"
