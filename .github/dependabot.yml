version: 2
updates:
  # Workflow actions are pinned by major tag (by commit SHA in release.yml);
  # this keeps both current and surfaces security releases as pull requests.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /services/runner
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
