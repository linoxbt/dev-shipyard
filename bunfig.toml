[install]
# 24h supply-chain guard: skip package versions published less than a day ago.
minimumReleaseAge = 86400
# No exemptions. @lovable.dev/vite-tanstack-config used to be exempt, which
# removed the guard from the one package that assembles the whole build. A
# frozen-lockfile install never re-resolves, so the exemption bought nothing
# for CI or deploys; it only let an hours-old release into a fresh resolve.
# Each entry bypasses the guard for one package: confirm with the user before
# adding any.
minimumReleaseAgeExcludes = []
